    source: ISS sea-level-equivalent cabin pressure (14.7 psia)
    confidence: high
  nominal_o2_mole_fraction:
    value: 0.21
    unit: "1"
    source: sea-level air composition, ISS nominal cabin mix
    confidence: high
  nominal_cabin_temperature:
