# EIO crew bench - engineering parameters.
#
# Every leaf is a mapping with exactly four keys:
#   value       number, or the string TODO when not yet established
#   unit        SI unless stated; "1" for dimensionless
#   source      where the number comes from (document, standard, or "design choice")
#   confidence  high | medium | low | unknown
#
# Bare numbers are not allowed anywhere in this file; the loader rejects them.
# "design choice" sources are decisions made in this repo, not measured facts.

constants:
  gas_constant:
    value: 8.314462618
    unit: J/(mol*K)
    source: CODATA 2018 recommended value
    confidence: high
  molar_mass_o2:
    value: 31.998
    unit: g/mol
    source: IUPAC standard atomic weights (2 x 15.999)
    confidence: high
  molar_mass_co2:
    value: 44.009
    unit: g/mol
    source: IUPAC standard atomic weights (12.011 + 2 x 15.999)
    confidence: high
  molar_mass_n2:
    value: 28.014
    unit: g/mol
    source: IUPAC standard atomic weights (2 x 14.007)
    confidence: high

