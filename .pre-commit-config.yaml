# Install once with `uv run pre-commit install`; hooks then run on every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-changed-tests
        name: pytest -q on changed tests
        entry: uv run pytest -q --tb=short
        language: system
        files: ^tests/test_.*\.py$
        pass_filenames: true
