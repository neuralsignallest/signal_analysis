[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eio-crewbench"
version = "0.0.1"
description = "Schemas and configuration for the EIO crew-support ECLSS benchmark."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["eio_crewbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
