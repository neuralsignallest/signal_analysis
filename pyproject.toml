[project]
name = "eio-crewbench"
version = "0.0.1"
description = "EIO-CrewBench: an open, physics-grounded benchmark for closed-loop spacecraft anomaly management."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.11",
    "numpy>=2.2",
    "scipy>=1.15",
    "networkx>=3.4",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
smt = ["z3-solver>=4.13"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "pre-commit>=4.0",
    "import-linter>=2.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eio_crewbench"]

# --------------------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Legacy files at the repository root (EMG notebooks and .m scripts) predate this package
# and are out of scope for linting.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["eio_crewbench"]

# --------------------------------------------------------------------------------------
# pytest / coverage
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["eio_crewbench"]
branch = true

# --------------------------------------------------------------------------------------
# import-linter: dependency direction (see CLAUDE.md and docs/RFC.md)
#
# Layers, top to bottom:  agents > eval > api > (obs, shield, ops, scenarios) > plant
# Lower layers never import higher ones. The four mid-layer packages may import each other
# (":" = non-independent siblings), with one explicit exception enforced below:
# shield may import plant but never scenarios. viz may import eval only.
# eio_crewbench.rng is a leaf utility and may be imported from anywhere.
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "eio_crewbench"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture: agents > eval > api > (obs, shield, ops, scenarios) > plant"
type = "layers"
layers = [
    "eio_crewbench.agents",
    "eio_crewbench.eval",
    "eio_crewbench.api",
    "eio_crewbench.obs : eio_crewbench.shield : eio_crewbench.ops : eio_crewbench.scenarios",
    "eio_crewbench.plant",
]

[[tool.importlinter.contracts]]
name = "shield never imports scenarios"
type = "forbidden"
source_modules = ["eio_crewbench.shield"]
forbidden_modules = ["eio_crewbench.scenarios"]

[[tool.importlinter.contracts]]
name = "viz may import eval only"
type = "forbidden"
source_modules = ["eio_crewbench.viz"]
forbidden_modules = [
    "eio_crewbench.agents",
    "eio_crewbench.api",
    "eio_crewbench.obs",
    "eio_crewbench.shield",
    "eio_crewbench.ops",
    "eio_crewbench.scenarios",
    "eio_crewbench.plant",
]
